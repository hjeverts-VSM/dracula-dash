[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dash-dracula-theme"
version = "0.1.2"
description = "Dracula dark/light theme for Plotly Dash applications"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "hjeverts-VSM" }]
requires-python = ">=3.9"
dependencies = [
    "dash>=4.0",
    "plotly>=5.0",
    "dash-bootstrap-components>=2.0",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0", "kaleido>=0.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dash_dracula*"]

[tool.setuptools.package-data]
dash_dracula = ["assets/*.css"]
